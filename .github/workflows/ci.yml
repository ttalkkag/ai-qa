name: Product CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Python and Django (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      PYTHONUNBUFFERED: "1"
      UV_NO_PROGRESS: "1"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.12"
          enable-cache: false

      - name: Install locked development dependencies
        run: uv sync --locked --extra dev --python 3.11

      - name: Run Python tests
        run: make check

      - name: Check Django configuration
        run: .venv/bin/python -m django check --settings=config.test_settings

      - name: Check migration drift
        run: .venv/bin/python -m django makemigrations --check --dry-run --settings=config.test_settings

      - name: Check Python and browser JavaScript syntax
        run: |
          .venv/bin/python -m compileall -q apps config integrations manage.py
          for script in static/js/*.js; do
            node --check "$script"
          done

  e2e:
    name: Docker Playwright E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run isolated browser tests
        run: make e2e-docker

      - name: Upload browser test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-e2e
          path: test-results/e2e/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false
