<div class="site-notifications" role="status" aria-label="알림" data-account="{{ user.pk|default:'anonymous' }}"{% if not messages %} hidden{% endif %}>
  <div class="container notification-content">
    <div class="notification-messages">{% for message in messages %}<p>{{ message }}</p>{% endfor %}</div>
    <button type="button" class="notification-close" aria-label="알림 닫기" title="알림 닫기" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
  </div>
</div>
