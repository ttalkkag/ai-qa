<dialog id="confirmation-dialog" aria-labelledby="confirmation-title" aria-describedby="confirmation-message">
  <h2 id="confirmation-title">작업 확인</h2>
  <p id="confirmation-message"></p>
  <dl id="confirmation-summary"></dl>
  <div class="form-actions">
    <button type="button" id="confirmation-no" autofocus>아니오</button>
    <button type="button" id="confirmation-yes" class="primary">예</button>
  </div>
</dialog>
<noscript><p class="container">중요한 작업을 제출하려면 JavaScript를 활성화하세요. 확인 기능이 준비되기 전에는 해당 입력 폼을 사용할 수 없습니다.</p></noscript>
